```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeviceMotion - Sensores</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        .sensors {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .sensor {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .sensor h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .value {
            font-size: 22px;
            font-weight: bold;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .status {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .sensors {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sensor de movimento</h1>

    <button id="startButton">
        Iniciar sensores
    </button>

    <div id="status" class="status">
        Sensores não iniciados
    </div>

    <!-- Aceleração -->
    <div class="sensors">

        <div class="sensor">
            <h2>Aceleração X</h2>
            <div id="accX" class="value">0</div>
            <small>m/s²</small>
        </div>

        <div class="sensor">
            <h2>Aceleração Y</h2>
            <div id="accY" class="value">0</div>
            <small>m/s²</small>
        </div>

        <div class="sensor">
            <h2>Aceleração Z</h2>
            <div id="accZ" class="value">0</div>
            <small>m/s²</small>
        </div>

    </div>

    <!-- Rotação -->
    <div class="sensors">

        <div class="sensor">
            <h2>Alpha</h2>
            <div id="alpha" class="value">0</div>
            <small>°/s</small>
        </div>

        <div class="sensor">
            <h2>Beta</h2>
            <div id="beta" class="value">0</div>
            <small>°/s</small>
        </div>

        <div class="sensor">
            <h2>Gamma</h2>
            <div id="gamma" class="value">0</div>
            <small>°/s</small>
        </div>

    </div>

    <!-- Gráfico -->
    <div class="chart-container">
        <canvas id="motionChart"></canvas>
    </div>

</div>


<script>

    // ==========================================
    // ELEMENTOS HTML
    // ==========================================

    const startButton = document.getElementById("startButton");
    const statusElement = document.getElementById("status");

    const accXElement = document.getElementById("accX");
    const accYElement = document.getElementById("accY");
    const accZElement = document.getElementById("accZ");

    const alphaElement = document.getElementById("alpha");
    const betaElement = document.getElementById("beta");
    const gammaElement = document.getElementById("gamma");


    // ==========================================
    // CONFIGURAÇÃO DO GRÁFICO
    // ==========================================

    const ctx = document
        .getElementById("motionChart")
        .getContext("2d");

    const motionChart = new Chart(ctx, {

        type: "line",

        data: {

            labels: [],

            datasets: [

                {
                    label: "Aceleração X",
                    data: [],
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.2
                },

                {
                    label: "Aceleração Y",
                    data: [],
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.2
                },

                {
                    label: "Aceleração Z",
                    data: [],
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.2
                }

            ]
        },

        options: {

            responsive: true,

            animation: false,

            interaction: {
                intersect: false,
                mode: "index"
            },

            scales: {

                x: {
                    title: {
                        display: true,
                        text: "Tempo"
                    }
                },

                y: {
                    title: {
                        display: true,
                        text: "Aceleração (m/s²)"
                    }
                }

            }
        }

    });


    // ==========================================
    // CONTROLE DO TEMPO
    // ==========================================

    let startTime = null;

    // Quantidade máxima de pontos no gráfico
    const MAX_POINTS = 100;


    // ==========================================
    // FUNÇÃO PARA ADICIONAR DADOS AO GRÁFICO
    // ==========================================

    function addDataToChart(x, y, z) {

        if (startTime === null) {
            startTime = performance.now();
        }

        const elapsed =
            (performance.now() - startTime) / 1000;

        const time = elapsed.toFixed(1);

        motionChart.data.labels.push(time);

        motionChart.data.datasets[0].data.push(x);
        motionChart.data.datasets[1].data.push(y);
        motionChart.data.datasets[2].data.push(z);


        // Remove os pontos antigos
        if (
            motionChart.data.labels.length >
            MAX_POINTS
        ) {

            motionChart.data.labels.shift();

            motionChart.data.datasets.forEach(
                dataset => {
                    dataset.data.shift();
                }
            );

        }


        motionChart.update("none");
    }


    // ==========================================
    // RECEBER DADOS DO DEVICEMOTION
    // ==========================================

    function handleMotion(event) {

        const acceleration =
            event.acceleration;

        const rotation =
            event.rotationRate;


        // --------------------------------------
        // ACELERAÇÃO
        // --------------------------------------

        const x =
            acceleration?.x ?? 0;

        const y =
            acceleration?.y ?? 0;

        const z =
            acceleration?.z ?? 0;


        // --------------------------------------
        // MOSTRAR NA INTERFACE
        // --------------------------------------

        accXElement.textContent =
            x.toFixed(2);

        accYElement.textContent =
            y.toFixed(2);

        accZElement.textContent =
            z.toFixed(2);


        // --------------------------------------
        // ROTAÇÃO
        // --------------------------------------

        const alpha =
            rotation?.alpha ?? 0;

        const beta =
            rotation?.beta ?? 0;

        const gamma =
            rotation?.gamma ?? 0;


        alphaElement.textContent =
            alpha.toFixed(2);

        betaElement.textContent =
            beta.toFixed(2);

        gammaElement.textContent =
            gamma.toFixed(2);


        // --------------------------------------
        // ATUALIZAR GRÁFICO
        // --------------------------------------

        addDataToChart(x, y, z);
    }


    // ==========================================
    // INICIAR SENSOR
    // ==========================================

    async function startSensors() {

        try {

            // Alguns dispositivos, principalmente
            // iOS, exigem permissão explícita.

            if (
                typeof DeviceMotionEvent !== "undefined" &&
                typeof DeviceMotionEvent.requestPermission === "function"
            ) {

                const permission =
                    await DeviceMotionEvent.requestPermission();

                if (permission !== "granted") {

                    statusElement.textContent =
                        "Permissão para sensores negada.";

                    return;
                }
            }


            // Resetar tempo
            startTime = null;


            // Registrar listener
            window.addEventListener(
                "devicemotion",
                handleMotion
            );


            statusElement.textContent =
                "Sensores funcionando";


            startButton.textContent =
                "Sensores ativos";

            startButton.disabled = true;


        } catch (error) {

            console.error(error);

            statusElement.textContent =
                "Erro ao iniciar os sensores.";

        }
    }


    // ==========================================
    // BOTÃO
    // ==========================================

    startButton.addEventListener(
        "click",
        startSensors
    );

</script>

</body>
</html>
